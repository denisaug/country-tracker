<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Racooner — Stay Tracker</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<meta name="description" content="Track how many days you stay in several countries at once — Schengen-style 90/180, yearly caps and consecutive-month limits, all on one calendar. Private, in your browser." />

<!-- Open Graph / social share -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Racooner" />
<meta property="og:title" content="Racooner — multi-country Stay Tracker" />
<meta property="og:description" content="Track your days across several countries at once — 90/180, yearly caps and consecutive-month limits on one calendar. Private, in your browser." />
<meta property="og:url" content="https://racooner.govorunov.pro/" />
<meta property="og:image" content="https://racooner.govorunov.pro/og-image.png" />
<meta property="og:image:width" content="1424" />
<meta property="og:image:height" content="752" />
<meta property="og:image:alt" content="A cozy illustration of a raccoon traveller with a backpack and walking staff." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Racooner — multi-country Stay Tracker" />
<meta name="twitter:description" content="Track your days across several countries at once — all on one calendar. Private, in your browser." />
<meta name="twitter:image" content="https://racooner.govorunov.pro/og-image.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Hanken+Grotesk:wght@400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Space+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app" data-theme="passport" data-density="compact">

  <header class="topbar">
    <div class="brand">
      <svg class="paw" viewBox="0 0 32 32" aria-hidden="true">
        <ellipse cx="16" cy="21" rx="8.5" ry="7"></ellipse>
        <circle cx="7.5" cy="12" r="3.1"></circle><circle cx="14" cy="8.5" r="3.4"></circle>
        <circle cx="22" cy="9.5" r="3.4"></circle><circle cx="27" cy="14.5" r="3"></circle>
      </svg>
      <div class="words"><span class="wm">Racooner</span><span class="sub">Stay Tracker</span></div>
    </div>

    <nav class="viewseg">
      <button data-view="calendar" class="on">Calendar</button>
      <button data-view="stats">Stats</button>
    </nav>

    <div class="tb-actions">
      <button id="help-top" class="help-top" type="button" title="How it works" aria-label="How it works">?</button>
      <div class="segctl">
        <button id="theme-switch" class="segpart segpart-l" type="button" title="Switch theme — click to cycle" aria-label="Theme">
          <span class="tdots">
            <span class="tdot" data-theme-opt="passport"></span>
            <span class="tdot" data-theme-opt="studio"></span>
            <span class="tdot" data-theme-opt="cockpit"></span>
          </span>
          <span class="tname">Passport</span>
        </button>
        <button id="density-toggle" class="segpart segpart-r" type="button" title="Toggle compact calendar" aria-pressed="true">
          <span class="dname">Compact</span>
          <span class="ddots">
            <span class="ddot" data-density-opt="compact"></span>
            <span class="ddot" data-density-opt="regular"></span>
          </span>
        </button>
      </div>
      <button id="export" class="tbtn ghost"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M12 3v13M7 8l5-5 5 5"></path></svg><span>Export</span></button>
      <button id="import" class="tbtn ghost"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M12 16V3M7 11l5 5 5-5"></path></svg><span>Import</span></button>
      <button id="reset" class="tbtn ghost danger"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"></path></svg><span>Reset</span></button>
    </div>
  </header>

  <main>
    <section id="view-calendar" class="view">
      <div id="calendar"></div>
    </section>

    <section id="view-stats" class="view" hidden>
      <div class="stats-main">
        <div class="year-row"><span class="year-row-label">Years</span><div class="year-pick" id="year-pick"></div><span class="year-row-hint">pick several to sum</span></div>
        <div class="kpi-row" id="kpi-row"></div>
        <section class="card">
          <h3>Days per country · <span id="chart-year"></span></h3>
          <div id="chart"></div>
        </section>
        <section class="card">
          <div class="map-head">
            <h3>Map</h3>
            <div class="map-switch" id="map-switch">
              <button data-map="d3globe" class="on">Globe</button>
              <button data-map="flat">Flat map</button>
            </div>
          </div>
          <div id="map"><p class="empty">Loading map…</p></div>
          <p class="map-note" id="map-note"></p>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-foot">
    <div class="sf-inner">
      <p class="sf-note">Built by a fellow border-hopper. Found a bug, want a feature, or just travelling the same routes? <b>Drop me a line.</b></p>
      <div class="sf-links">
        <a id="foot-linkedin" class="sf-link" href="#" target="_blank" rel="noopener" hidden>
          <svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.22.79 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"></path></svg>
          <span>LinkedIn</span>
        </a>
        <a id="foot-github" class="sf-link" href="#" target="_blank" rel="noopener" hidden>
          <svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58 0-.29-.01-1.04-.02-2.05-3.34.73-4.04-1.61-4.04-1.61-.55-1.38-1.33-1.75-1.33-1.75-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.11-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22 0 1.6-.01 2.9-.01 3.29 0 .32.22.7.83.58A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"></path></svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </footer>

  <div id="violation-tip"></div>

  <div id="privacy-note" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <span>Your trips stay in this browser — never sent to a server.</span>
    <button id="privacy-note-x" type="button" aria-label="Dismiss">×</button>
  </div>
</div>

<!-- map deps (CDN, no build step). The calendar/stats logic depends on nothing else. -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<script src="engine.js"></script>
<script src="countries-data.js"></script>
<script src="stats.js"></script>
<script src="app.js"></script>
<!-- <script src="raccoon.js"></script> -->
</body>
</html>
